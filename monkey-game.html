<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Monkey Banana Math Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #b8ecff 0%, #d8f7c8 55%, #8bd17c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #2f2a1f;
    }

    .game {
      width: 100%;
      max-width: 980px;
      background: rgba(255,255,255,0.9);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.16);
      padding: 24px;
      border: 4px solid #fff5d7;
    }

    .title {
      text-align: center;
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 44px);
    }

    .subtitle {
      text-align: center;
      margin: 0 0 22px;
      font-size: 18px;
    }

    .top-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat {
      background: #fff8df;
      border: 3px solid #f4d36a;
      border-radius: 18px;
      padding: 12px;
      text-align: center;
      font-weight: 700;
    }

    .scene {
      position: relative;
      height: 360px;
      background: linear-gradient(180deg, #9fe7ff 0%, #d1f6b9 60%, #8ed77c 100%);
      border-radius: 24px;
      overflow: hidden;
      border: 4px solid #7cc46e;
      margin-bottom: 22px;
    }

    .tree {
      position: absolute;
      right: 80px;
      bottom: 50px;
      width: 120px;
      height: 210px;
    }

    .trunk {
      position: absolute;
      bottom: 0;
      left: 42px;
      width: 36px;
      height: 130px;
      background: #8b5a2b;
      border-radius: 12px;
    }

    .leaves {
      position: absolute;
      top: 0;
      left: 0;
      width: 120px;
      height: 110px;
      background: #3dac4f;
      border-radius: 50%;
      box-shadow: -24px 20px 0 #44bb58, 24px 20px 0 #44bb58;
    }

    .banana {
      position: absolute;
      top: 75px;
      left: 20px;
      font-size: 52px;
      transform: rotate(-10deg);
      filter: drop-shadow(0 6px 4px rgba(0,0,0,0.15));
      transition: top 0.06s linear, left 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
    }

    .banana.splat-hidden {
      opacity: 0;
    }

    .splat {
      position: absolute;
      right: 65px;
      bottom: 40px;
      font-size: 44px;
      transform: scale(0);
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .splat.show {
      transform: scale(1);
      opacity: 1;
    }

    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58px;
      background: #5fb34f;
    }

    .monkey-wrap {
      position: absolute;
      left: 90px;
      bottom: 58px;
      transition: transform 0.35s ease;
      transform-origin: bottom center;
    }

    .monkey-wrap.walking .arm.left { animation: swing-left 0.26s infinite ease-in-out alternate; }
    .monkey-wrap.walking .arm.right { animation: swing-right 0.26s infinite ease-in-out alternate; }
    .monkey-wrap.walking .leg.left { animation: step-left 0.24s infinite ease-in-out alternate; }
    .monkey-wrap.walking .leg.right { animation: step-right 0.24s infinite ease-in-out alternate; }

    .monkey-wrap.idle .arm.left, .monkey-wrap.idle .arm.right,
    .monkey-wrap.idle .leg.left, .monkey-wrap.idle .leg.right {
      animation: none;
    }

    .monkey-wrap.eating {
      animation: chew 0.18s 6 ease-in-out;
    }

    .monkey {
      position: relative;
      width: 150px;
      height: 150px;
    }

    .body {
      position: absolute;
      width: 84px;
      height: 92px;
      background: #9b6037;
      border-radius: 45px;
      left: 33px;
      top: 48px;
    }

    .belly {
      position: absolute;
      width: 48px;
      height: 54px;
      background: #f0c59b;
      border-radius: 50%;
      left: 51px;
      top: 70px;
    }

    .message {

      display: flex;
      align-items: center;

      justify-content: center;
      font-weight: 700;
      color: #6d4a15;
    }

    .timer-track {
      width: min(100%, 320px);

      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #63bf4f 0%, #ffd447 60%, #ff8b4f 100%);
      transition: width 0.1s linear;

    .win {

    .lose {
      color: #9d1e1e;

    @keyframes swing-left {
      from { transform: rotate(18deg); }
      to { transform: rotate(42deg); }
    }

    @keyframes swing-right {
      from { transform: rotate(-18deg); }
      to { transform: rotate(-42deg); }
    }

    @keyframes step-left {
      from { transform: rotate(-6deg); }
      to { transform: rotate(18deg); }
    }

    @keyframes step-right {
      from { transform: rotate(6deg); }
      to { transform: rotate(-18deg); }
    }

    @keyframes chew {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @media (max-width: 760px) {
      .top-bar, .controls {
        grid-template-columns: 1fr 1fr;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .scene {
        height: 300px;
      }

      .tree {
        right: 24px;
        transform: scale(0.88);
        transform-origin: bottom right;
      }

      .monkey-wrap {
        left: 24px;
      }
    }
  </style>

    <div class="scene">
      <div class="monkey-wrap" id="monkeyWrap">
        <div class="monkey">
          <div class="tail"></div>
          <div class="arm left"></div>

          <div class="body"></div>
          <div class="belly"></div>

          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="face"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="smile"></div>
        </div>
      </div>

      <div class="tree">
        <div class="leaves"></div>
        <div class="banana" id="banana">🍌</div>
        <div class="trunk"></div>
      </div>

      <div class="splat" id="splat">💥</div>

    <div class="controls">
      <div class="question-box">
        <div class="question" id="questionText">2 + 3 = ?</div>
        <div class="timer-row">
          <span>⏱️ <span id="timerLabel">10.0</span>s</span>
          <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
        </div>
        <div class="answer-row">
          <input id="answerInput" type="number" inputmode="numeric" placeholder="Your answer" />
          <button class="primary" id="submitBtn">Check</button>
          <button class="secondary" id="restartBtn">Restart</button>
        </div>
      </div>

      <div class="message-box">
        <div class="message" id="messageText">Let's help the monkey!</div>
      </div>

    <div class="footer-note">

    </div>
  </div>

  <script>
    const questionText = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const restartBtn = document.getElementById('restartBtn');
    const messageText = document.getElementById('messageText');
    const netSuccessEl = document.getElementById('netSuccess');
    const netIncorrectEl = document.getElementById('netIncorrect');
    const correctCountEl = document.getElementById('correctCount');
    const wrongCountEl = document.getElementById('wrongCount');
    const monkeyWrap = document.getElementById('monkeyWrap');
    const bananaEl = document.getElementById('banana');
    const splatEl = document.getElementById('splat');
    const timerLabel = document.getElementById('timerLabel');
    const timerFill = document.getElementById('timerFill');

    let currentAnswer = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let netScore = 0;
    let gameOver = false;
    let roundResolved = false;
    let questionStartAt = 0;
    let timerId = null;
    const roundMs = 10000;
    const bananaStartTop = 75;
    const bananaGroundTop = 225;

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function updateMonkey() {
      const scale = Math.max(0.55, 1 + netScore * 0.06);
      const moveX = Math.max(0, netScore * 18);
      monkeyWrap.style.transform = `translateX(${moveX}px) scale(${scale})`;
    }

    function setMonkeyState(state) {
      monkeyWrap.classList.remove('idle', 'walking', 'eating');
      monkeyWrap.classList.add(state);
    }

    function updateStats() {
      netSuccessEl.textContent = Math.max(0, netScore);
      netIncorrectEl.textContent = Math.max(0, -netScore);
      correctCountEl.textContent = correctCount;
      wrongCountEl.textContent = wrongCount;
      updateMonkey();
    }

    function setMessage(text, type = '') {
      messageText.textContent = text;
      messageText.className = 'message';
      if (type) messageText.classList.add(type);
    }

    function checkWinLose() {
      if (netScore >= 10) {
        gameOver = true;
        setMessage('🎉 You win! The monkey got the banana! 🍌', 'win');
        questionText.textContent = 'You did it!';
        stopTimer();
        return true;
      }

      if (netScore <= -5) {
        gameOver = true;
        setMessage('🙈 Oh no! The monkey got too tiny. Try again!', 'lose');
        questionText.textContent = 'Game Over';
        stopTimer();
        return true;
      }

      return false;
    }

    function resetBananaVisual() {
      bananaEl.style.top = `${bananaStartTop}px`;
      bananaEl.style.left = '20px';
      bananaEl.classList.remove('splat-hidden');
      bananaEl.style.transform = 'rotate(-10deg)';
      splatEl.classList.remove('show');
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function startRoundTimer() {
      stopTimer();
      questionStartAt = performance.now();
      timerLabel.textContent = '10.0';
      timerFill.style.width = '100%';
      bananaEl.style.top = `${bananaStartTop}px`;

      timerId = setInterval(() => {
        const elapsed = performance.now() - questionStartAt;
        const remaining = Math.max(0, roundMs - elapsed);
        const ratio = remaining / roundMs;
        const bananaTop = bananaStartTop + ((1 - ratio) * (bananaGroundTop - bananaStartTop));

        timerLabel.textContent = (remaining / 1000).toFixed(1);
        timerFill.style.width = `${ratio * 100}%`;
        bananaEl.style.top = `${bananaTop}px`;

        if (remaining <= 0) {
          resolveRound(false, true);
        }
      }, 50);
    }

    function resolveRound(isCorrect, timedOut = false) {
      if (gameOver || roundResolved) return;
      roundResolved = true;
      stopTimer();

      if (isCorrect) {
        correctCount += 1;
        netScore += 1;
        setMonkeyState('walking');
        bananaEl.style.left = '-130px';
        bananaEl.style.top = '168px';
        bananaEl.style.transform = 'rotate(20deg)';
        setTimeout(() => {
          bananaEl.classList.add('splat-hidden');
          setMonkeyState('eating');
          setMessage('✅ Great job! Monkey caught and ate the banana, then got stronger!', 'win');
          updateStats();
          if (!checkWinLose()) {
            setTimeout(() => generateQuestion(), 550);
          }
        }, 360);
      } else {
        wrongCount += 1;
        netScore -= 1;
        bananaEl.style.top = `${bananaGroundTop}px`;
        bananaEl.style.transform = 'rotate(8deg)';
        bananaEl.classList.add('splat-hidden');
        splatEl.classList.add('show');
        setMonkeyState('idle');
        if (timedOut) {
          setMessage(`⏰ Time's up! The banana splatted. Answer was ${currentAnswer}.`, 'lose');
        } else {
          setMessage(`❌ Oops! The banana splatted. The right answer was ${currentAnswer}.`, 'lose');
        }
        updateStats();
        if (!checkWinLose()) {
          setTimeout(() => generateQuestion(), 700);
        }
      }
    }

    function submitAnswer() {
      if (gameOver || roundResolved) return;

      const userAnswer = Number(answerInput.value);
      if (answerInput.value.trim() === '') {
        setMessage('Type an answer first!');
        return;
      }

      resolveRound(userAnswer === currentAnswer, false);
    }

    function restartGame() {
      stopTimer();
      correctCount = 0;
      wrongCount = 0;
      netScore = 0;
      gameOver = false;
      roundResolved = false;
      setMonkeyState('idle');
      resetBananaVisual();
      timerLabel.textContent = '10.0';
      timerFill.style.width = '100%';
      setMessage("Let's help the monkey!");
      updateStats();
      generateQuestion();
    }

    submitBtn.addEventListener('click', submitAnswer);
    restartBtn.addEventListener('click', restartGame);
    answerInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitAnswer();
    });

    function generateQuestion() {
      const useAddition = Math.random() < 0.6;
      let a, b, symbol;

      if (useAddition) {
        a = randomInt(0, 10);
        b = randomInt(0, 10);
        currentAnswer = a + b;
        symbol = '+';
      } else {
        a = randomInt(0, 10);
        b = randomInt(0, a);
        currentAnswer = a - b;
        symbol = '-';
      }

      roundResolved = false;
      questionText.textContent = `${a} ${symbol} ${b} = ?`;
      answerInput.value = '';
      answerInput.focus();
      resetBananaVisual();
      setMonkeyState('idle');
      startRoundTimer();
    }

    restartGame();
  </script>
</body>
</html>
